site_name: Vouch Runtime
site_description: Transaction runtime for autonomous software agents
site_url: https://duriantaco.github.io/vouch/
repo_url: https://github.com/duriantaco/vouch
repo_name: duriantaco/vouch
docs_dir: docs/site
site_dir: _site

theme:
  name: material
  logo: assets/vouch.png
  favicon: assets/vouch.png
  palette:
    scheme: default
    primary: white
    accent: teal
  features:
    - navigation.sections
    - navigation.tabs
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Runtime: index.md
  - Contracts:
      - Compiler module: compiler.md
      - CI integration: github-actions.md
  - Acceptance: benchmarks.md
